name: dbt Daily Run

on:
  schedule:
    # Run at 10:00 UTC daily (4h after Most Popular ingest; 2h after Books on Thu)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Run with --full-refresh flag'
        required: false
        default: 'false'
        type: boolean
      select:
        description: 'dbt select argument (e.g., +fct_articles)'
        required: false
        default: ''
        type: string

jobs:
  dbt_run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies (dbt Fusion bootstrap)
        run: uv sync --group dbt

      - name: Verify dbt Fusion
        run: uv run dbt --version
      
      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          nyt_bigquery:
            target: prod
            outputs:
              prod:
                type: bigquery
                method: service-account-json
                project: times-api-ingest
                dataset: dbt
                location: US
                threads: 4
                timeout_seconds: 300
                priority: interactive
                keyfile_json: ${{ secrets.GCP_SA_KEY }}
          EOF

      - name: Configure dbt Cloud Auth (CI)
        env:
          DBT_CLOUD_YML: ${{ secrets.DBT_CLOUD_YML }}
        if: ${{ env.DBT_CLOUD_YML != '' }}
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/dbt_cloud.yml << 'EOF'
          ${{ secrets.DBT_CLOUD_YML }}
          EOF
      
      - name: Install dbt packages
        working-directory: dbt_nyt_analytics
        run: uv run dbt deps

      - name: Find previous successful run
        id: prev-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=.github/workflows/dbt-run.yml \
            --status=success \
            --json databaseId \
            --jq "map(select(.databaseId != ${{ github.run_id }})) | first | .databaseId // empty")
          echo "run_id=${PREV_RUN_ID}" >> "$GITHUB_OUTPUT"
          if [ -n "$PREV_RUN_ID" ]; then
            echo "Previous successful run: ${PREV_RUN_ID}"
          else
            echo "No previous successful run found"
          fi

      - name: Download previous dbt artifacts
        if: steps.prev-run.outputs.run_id != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dbt-artifacts
          path: previous-dbt-artifacts
          github-token: ${{ github.token }}
          run-id: ${{ steps.prev-run.outputs.run_id }}

      - name: Check source freshness
        working-directory: dbt_nyt_analytics
        run: uv run dbt source freshness
      
      - name: dbt build
        working-directory: dbt_nyt_analytics
        env:
          PREV_STATE: ../previous-dbt-artifacts/dbt_nyt_analytics/target
        run: |
          FLAGS="--write-catalog"
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            FLAGS="$FLAGS --full-refresh"
          fi
          if [ -n "${{ github.event.inputs.select }}" ]; then
            FLAGS="$FLAGS --select ${{ github.event.inputs.select }}"
          elif [ -f "$PREV_STATE/manifest.json" ] && [ -f "$PREV_STATE/sources.json" ]; then
            echo "Prior artifacts found; building state:modified+ and source_status:fresher+"
            FLAGS="$FLAGS --select state:modified+ source_status:fresher+ --state $PREV_STATE"
          else
            echo "No prior artifacts; running full build"
          fi
          uv run dbt build $FLAGS
      
      - name: Prepare static dbt docs site
        working-directory: dbt_nyt_analytics
        run: bash pages/prepare_site.sh

      - name: Upload docs site artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs-site
          path: dbt_nyt_analytics/site
          retention-days: 1

      - name: Upload dbt artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-artifacts
          path: |
            dbt_nyt_analytics/target/manifest.json
            dbt_nyt_analytics/target/run_results.json
            dbt_nyt_analytics/target/catalog.json
            dbt_nyt_analytics/target/sources.json
          retention-days: 7
