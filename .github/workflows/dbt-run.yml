name: dbt Daily Run

on:
  schedule:
    # Run at 8:00 UTC daily (2 hours after ingestion at 6:00 UTC)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Run with --full-refresh flag'
        required: false
        default: 'false'
        type: boolean
      select:
        description: 'dbt select argument (e.g., +fct_articles)'
        required: false
        default: ''
        type: string

jobs:
  dbt_run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies (dbt Fusion bootstrap)
        run: uv sync --group dbt

      - name: Install Fusion runtime
        run: uv run dbt system update

      - name: Verify dbt Fusion
        run: uv run dbt --version
      
      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          nyt_bigquery:
            target: prod
            outputs:
              prod:
                type: bigquery
                method: service-account-json
                project: times-api-ingest
                dataset: dbt
                location: US
                threads: 4
                timeout_seconds: 300
                priority: interactive
                keyfile_json: ${{ secrets.GCP_SA_KEY }}
          EOF
      
      - name: Install dbt packages
        working-directory: dbt_nyt_analytics
        run: uv run dbt deps

      - name: Check source freshness
        working-directory: dbt_nyt_analytics
        run: uv run dbt source freshness
      
      - name: dbt build
        working-directory: dbt_nyt_analytics
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            FLAGS="$FLAGS --full-refresh"
          fi
          if [ -n "${{ github.event.inputs.select }}" ]; then
            FLAGS="$FLAGS --select ${{ github.event.inputs.select }}"
          fi
          uv run dbt build $FLAGS
      
      - name: Generate dbt docs
        working-directory: dbt_nyt_analytics
        run: uv run dbt docs generate
      
      - name: Deploy dbt docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dbt_nyt_analytics/target
          publish_branch: gh-pages

      - name: Upload dbt artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-artifacts
          path: |
            dbt_nyt_analytics/target/manifest.json
            dbt_nyt_analytics/target/run_results.json
            dbt_nyt_analytics/target/catalog.json
            dbt_nyt_analytics/target/sources.json
          retention-days: 7
