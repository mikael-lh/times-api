name: dbt PR Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'dbt_nyt_analytics/**'

jobs:
  dbt_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Checkout main branch (for prod manifest)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies (PR branch)
        run: uv sync --group dbt --group dev

      - name: Install dependencies (main branch)
        working-directory: main-branch
        run: uv sync --group dbt

      - name: Configure dbt profile (CI)
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          nyt_bigquery:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: service-account-json
                project: times-api-ingest
                dataset: ci_dbt
                location: US
                threads: 4
                timeout_seconds: 300
                priority: interactive
                keyfile_json: ${{ secrets.GCP_SA_KEY }}
              prod:
                type: bigquery
                method: service-account-json
                project: times-api-ingest
                dataset: dbt
                location: US
                threads: 4
                timeout_seconds: 300
                priority: interactive
                keyfile_json: ${{ secrets.GCP_SA_KEY }}
          EOF

      - name: Configure dbt Cloud Auth (CI)
        env:
          DBT_CLOUD_YML: ${{ secrets.DBT_CLOUD_YML }}
        if: ${{ env.DBT_CLOUD_YML != '' }}
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/dbt_cloud.yml << 'EOF'
          ${{ secrets.DBT_CLOUD_YML }}
          EOF

      - name: Install dbt packages (PR branch)
        working-directory: dbt_nyt_analytics
        run: uv run dbt deps

      - name: Parse dbt project (manifest for documentation checks)
        working-directory: dbt_nyt_analytics
        run: uv run dbt parse

      - name: SQLFluff (format check and lint)
        run: |
          uv run sqlfluff fix dbt_nyt_analytics/models --check
          uv run sqlfluff lint dbt_nyt_analytics/models

      - name: Enforce dbt model documentation
        run: |
          for hook in check-model-has-properties-file check-model-has-description; do
            uv run pre-commit run "$hook" --all-files --show-diff-on-failure
          done

      - name: Install dbt packages (main branch)
        working-directory: main-branch/dbt_nyt_analytics
        run: uv run dbt deps

      - name: Generate prod manifest from main
        working-directory: main-branch/dbt_nyt_analytics
        run: uv run dbt compile --target prod

      - name: Build and test modified models
        working-directory: dbt_nyt_analytics
        env:
          DBT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          uv run dbt build \
            --target ci \
            --vars "{\"pr_number\": ${DBT_PR_NUMBER}}" \
            --select state:modified+ \
            --state ../main-branch/dbt_nyt_analytics/target/ \
            --defer \
            --favor-state

      - name: Report fct_best_sellers author_key stats (PR 74 diagnostic)
        if: github.event.pull_request.number == 74
        run: |
          uv sync --group dashboard
          uv run python <<'PY'
          import json
          import os

          from google.cloud import bigquery
          from google.oauth2 import service_account

          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["GCP_SA_KEY"])
          )
          client = bigquery.Client(credentials=creds, project="times-api-ingest")

          sql = """
          WITH bridge AS (
            SELECT
              published_date,
              list_name_encoded,
              rank,
              list_updated,
              COUNT(*) AS bridge_author_count,
              STRING_AGG(DISTINCT CAST(author_key AS STRING), ',' ORDER BY CAST(author_key AS STRING)) AS bridge_author_keys
            FROM `times-api-ingest.dbt_core.bridge_best_seller_authors`
            GROUP BY 1, 2, 3, 4
          ),
          fct AS (
            SELECT
              published_date,
              list_name_encoded,
              rank,
              list_updated,
              author_key AS fct_author_key
            FROM `times-api-ingest.dbt_core.fct_best_sellers`
          ),
          classified AS (
            SELECT
              COALESCE(b.bridge_author_count, 0) AS bridge_author_count,
              CASE
                WHEN COALESCE(b.bridge_author_count, 0) <= 1 THEN 'single_or_no_bridge'
                WHEN f.fct_author_key IS NULL THEN 'multi_author_fct_key_null'
                WHEN CAST(f.fct_author_key AS STRING) NOT IN UNNEST(SPLIT(b.bridge_author_keys, ',')) THEN 'multi_author_fct_key_not_in_bridge'
                ELSE 'multi_author_fct_key_is_one_of_many'
              END AS bucket
            FROM fct f
            LEFT JOIN bridge b USING (published_date, list_name_encoded, rank, list_updated)
          )
          SELECT bucket, COUNT(*) AS entry_count
          FROM classified
          GROUP BY 1
          ORDER BY 1
          """

          print("=== author_key bucket counts (prod) ===")
          for row in client.query(sql).result():
              print(f"{row.bucket}: {row.entry_count}")

          sample_sql = """
          WITH bridge AS (
            SELECT
              published_date,
              list_name_encoded,
              rank,
              list_updated,
              STRING_AGG(DISTINCT author_full_name, ' | ' ORDER BY author_full_name) AS bridge_authors,
              COUNT(*) AS bridge_author_count
            FROM `times-api-ingest.dbt_core.bridge_best_seller_authors`
            GROUP BY 1, 2, 3, 4
            HAVING COUNT(*) > 1
          ),
          stg AS (
            SELECT published_date, list_name_encoded, rank, list_updated, author AS raw_author_field, title
            FROM `times-api-ingest.dbt_staging.stg_best_sellers`
          ),
          fct AS (
            SELECT
              f.published_date,
              f.list_name_encoded,
              f.rank,
              f.list_updated,
              f.author_key AS fct_author_key,
              da.author_full_name AS fct_author_name
            FROM `times-api-ingest.dbt_core.fct_best_sellers` f
            LEFT JOIN `times-api-ingest.dbt_core.dim_authors` da
              ON f.author_key = da.author_key
          )
          SELECT
            s.title,
            s.raw_author_field,
            b.bridge_authors,
            b.bridge_author_count,
            f.fct_author_name
          FROM bridge b
          JOIN stg s USING (published_date, list_name_encoded, rank, list_updated)
          JOIN fct f USING (published_date, list_name_encoded, rank, list_updated)
          ORDER BY b.bridge_author_count DESC, s.title
          LIMIT 8
          """

          print("\n=== sample multi-author rows ===")
          for row in client.query(sample_sql).result():
              print(
                  f"title={row.title!r} | raw={row.raw_author_field!r} | "
                  f"bridge={row.bridge_authors!r} | fct={row.fct_author_name!r} | n={row.bridge_author_count}"
              )
          PY
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
