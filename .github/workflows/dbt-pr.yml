name: dbt PR Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'dbt_nyt_analytics/**'

jobs:
  dbt_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Checkout main branch (for prod manifest)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies (PR branch)
        run: uv sync --group dbt --group dev

      - name: Install Fusion runtime (PR branch)
        run: uv run dbt system update

      - name: Install dependencies (main branch)
        working-directory: main-branch
        run: uv sync --group dbt

      - name: Install Fusion runtime (main branch)
        working-directory: main-branch
        run: uv run dbt system update

      - name: Configure dbt profile (CI)
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          nyt_bigquery:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: service-account-json
                project: times-api-ingest
                dataset: ci_dbt
                location: US
                threads: 4
                timeout_seconds: 300
                priority: interactive
                keyfile_json: ${{ secrets.GCP_SA_KEY }}
              prod:
                type: bigquery
                method: service-account-json
                project: times-api-ingest
                dataset: dbt
                location: US
                threads: 4
                timeout_seconds: 300
                priority: interactive
                keyfile_json: ${{ secrets.GCP_SA_KEY }}
          EOF

      - name: Install dbt packages (PR branch)
        working-directory: dbt_nyt_analytics
        run: uv run dbt deps

      - name: Parse dbt project (manifest for documentation checks)
        working-directory: dbt_nyt_analytics
        run: uv run dbt parse

      - name: SQLFluff (format check and lint)
        run: |
          uv run sqlfluff fix dbt_nyt_analytics/models dbt_nyt_analytics/snapshots --check
          uv run sqlfluff lint dbt_nyt_analytics/models dbt_nyt_analytics/snapshots

      - name: Enforce dbt model documentation
        run: |
          for hook in check-model-has-properties-file check-model-has-description; do
            uv run pre-commit run "$hook" --all-files --show-diff-on-failure
          done

      - name: Install dbt packages (main branch)
        working-directory: main-branch/dbt_nyt_analytics
        run: uv run dbt deps

      - name: Generate prod manifest from main
        working-directory: main-branch/dbt_nyt_analytics
        run: uv run dbt compile --target prod

      - name: Build and test modified models
        working-directory: dbt_nyt_analytics
        run: |
          uv run dbt build \
            --select state:modified+ \
            --state ../main-branch/dbt_nyt_analytics/target/ \
            --defer \
            --favor-state
