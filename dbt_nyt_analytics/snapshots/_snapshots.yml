version: 2

snapshots:
  - name: books_snapshot
    description: >
      SCD Type 2 history of book metadata and best rank across all Best Sellers lists.
      Uses check strategy on metadata columns plus top_rank. Current rows feed dim_books; all versions feed dim_books_history.
    config:
      unique_key: primary_isbn13
      strategy: check
      check_cols:
        - title
        - publisher
        - description
        - top_rank
        - age_group
        - age_min
        - age_max
        - book_image
        - amazon_product_url
        - book_review_link
        - sunday_review_link
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - primary_isbn13
              - dbt_valid_from
    columns:
      - name: primary_isbn13
        description: "{{ doc('primary_isbn13') }}"
        tests:
          - not_null
          - unique:
              config:
                where: "dbt_valid_to is null"
      - name: title
        description: "{{ doc('book_title') }}"
      - name: publisher
        description: "{{ doc('book_publisher') }}"
      - name: description
        description: "{{ doc('book_description') }}"
      - name: age_group
        description: "{{ doc('age_group') }}"
      - name: age_min
        description: "{{ doc('age_min') }}"
      - name: age_max
        description: "{{ doc('age_max') }}"
      - name: book_image
        description: "{{ doc('book_image') }}"
      - name: amazon_product_url
        description: "{{ doc('amazon_product_url') }}"
      - name: book_review_link
        description: "{{ doc('book_review_link') }}"
      - name: sunday_review_link
        description: "{{ doc('sunday_review_link') }}"
      - name: latest_published_date
        description: "{{ doc('latest_published_date') }}"
      - name: top_rank
        description: "{{ doc('top_rank') }}"
      - name: dbt_scd_id
        description: "{{ doc('dbt_scd_id') }}"
        tests:
          - unique
          - not_null
      - name: dbt_updated_at
        description: "{{ doc('dbt_updated_at') }}"
      - name: dbt_valid_from
        description: "{{ doc('dbt_valid_from') }}"
        tests:
          - not_null
      - name: dbt_valid_to
        description: "{{ doc('dbt_valid_to') }}"
