version: 2

models:
  - name: int_keywords_flattened
    description: "One row per article-keyword combination. Unnests the keywords array."
    columns:
      - name: article_id
        description: "{{ doc('article_id') }}"
      - name: keyword_name
        description: "{{ doc('keyword_name') }}"
      - name: keyword_value
        description: "{{ doc('keyword_value') }}"
      - name: keyword_rank
        description: "{{ doc('keyword_rank') }}"

  - name: int_authors_flattened
    description: "One row per article-author combination. Unnests the byline_person array."
    columns:
      - name: article_id
        description: "{{ doc('article_id') }}"
      - name: author_full_name
        description: "{{ doc('author_full_name') }}"
      - name: firstname
        description: "{{ doc('firstname') }}"
      - name: lastname
        description: "{{ doc('lastname') }}"
