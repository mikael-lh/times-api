version: 2

models:
  - name: int_keywords_flattened
    description: "One row per article-keyword combination. Unnests the keywords array and deduplicates repeated name/value tags, keeping the lowest rank."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - article_id
              - keyword_name
              - keyword_value
    columns:
      - name: article_id
        description: "{{ doc('article_id') }}"
      - name: keyword_name
        description: "{{ doc('keyword_name') }}"
      - name: keyword_value
        description: "{{ doc('keyword_value') }}"
      - name: keyword_rank
        description: "{{ doc('keyword_rank') }}"

  - name: int_authors_flattened
    description: "One row per article-author combination. Unnests the byline_person array, filters blank entries, and deduplicates repeated names."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - article_id
              - author_full_name
    columns:
      - name: article_id
        description: "{{ doc('article_id') }}"
      - name: author_full_name
        description: "{{ doc('author_full_name') }}"
      - name: firstname
        description: "{{ doc('firstname') }}"
      - name: lastname
        description: "{{ doc('lastname') }}"

  - name: int_best_sellers_authors_parsed
    description: "Best Sellers list entries with author strings parsed into an authors array."
    columns:
      - name: published_date
        description: "{{ doc('bs_published_date') }}"
      - name: list_name_encoded
        description: "{{ doc('list_name_encoded') }}"
      - name: rank
        description: "{{ doc('bs_rank') }}"
      - name: list_updated
        description: "{{ doc('list_updated') }}"
      - name: authors
        description: "{{ doc('authors') }}"

  - name: int_best_sellers_authors_flattened
    description: "One row per Best Sellers list entry and parsed author name."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - published_date
              - list_name_encoded
              - rank
              - list_updated
              - author_full_name
    columns:
      - name: published_date
        description: "{{ doc('bs_published_date') }}"
        tests:
          - not_null
      - name: list_name_encoded
        description: "{{ doc('list_name_encoded') }}"
        tests:
          - not_null
      - name: rank
        description: "{{ doc('bs_rank') }}"
        tests:
          - not_null
      - name: list_updated
        description: "{{ doc('list_updated') }}"
        tests:
          - not_null
      - name: primary_isbn13
        description: "{{ doc('primary_isbn13') }}"
      - name: author_full_name
        description: "{{ doc('author_full_name') }}"
        tests:
          - not_null

  - name: int_best_sellers_books
    description: "One row per book (primary_isbn13) with metadata from the most recent list appearance; ties on the same week use alphabetically first list_name_encoded."
    columns:
      - name: primary_isbn13
        description: "{{ doc('primary_isbn13') }}"
        tests:
          - unique
          - not_null
      - name: title
        description: "{{ doc('book_title') }}"
      - name: publisher
        description: "{{ doc('book_publisher') }}"
      - name: description
        description: "{{ doc('book_description') }}"
      - name: age_group
        description: "{{ doc('age_group') }}"
      - name: age_min
        description: "{{ doc('age_min') }}"
      - name: age_max
        description: "{{ doc('age_max') }}"
      - name: latest_published_date
        description: "{{ doc('latest_published_date') }}"

  - name: int_books_snapshot_source
    description: "Pre-snapshot transformation view combining book metadata with calculated cumulative top rank."
    columns:
      - name: primary_isbn13
        description: "{{ doc('primary_isbn13') }}"
      - name: title
        description: "{{ doc('book_title') }}"
      - name: publisher
        description: "{{ doc('book_publisher') }}"
      - name: description
        description: "{{ doc('book_description') }}"
      - name: age_group
        description: "{{ doc('age_group') }}"
      - name: age_min
        description: "{{ doc('age_min') }}"
      - name: age_max
        description: "{{ doc('age_max') }}"
      - name: book_image
        description: "{{ doc('book_image') }}"
      - name: amazon_product_url
        description: "{{ doc('amazon_product_url') }}"
      - name: book_review_link
        description: "{{ doc('book_review_link') }}"
      - name: sunday_review_link
        description: "{{ doc('sunday_review_link') }}"
      - name: latest_published_date
        description: "{{ doc('latest_published_date') }}"
      - name: top_rank
        description: "{{ doc('top_rank') }}"

  - name: int_books_top_rank_scd
    description: "SCD Type 2 book versions driven by cumulative top_rank improvements and metadata changes. Weekly metadata uses the alphabetically first list_name_encoded when a book appears on multiple lists."
    columns:
      - name: book_scd_key
        description: "{{ doc('book_scd_key') }}"
        tests:
          - unique
          - not_null
      - name: primary_isbn13
        description: "{{ doc('primary_isbn13') }}"
        tests:
          - not_null
      - name: top_rank
        description: "{{ doc('top_rank_scd') }}"
      - name: valid_from
        description: "{{ doc('valid_from') }}"
        tests:
          - not_null
      - name: valid_to
        description: "{{ doc('valid_to') }}"
      - name: latest_published_date
        description: "{{ doc('latest_published_date') }}"

  - name: int_facets_flattened
    description: "One row per popular article and facet combination. Flattens raw description, organization, person, and geographic facets."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - article_id
              - facet_type
              - facet_value
    columns:
      - name: article_id
        description: "{{ doc('article_id') }}"
      - name: facet_type
        description: "The type of the facet (description, organization, person, geographic)"
      - name: facet_value
        description: "The value of the facet string"
