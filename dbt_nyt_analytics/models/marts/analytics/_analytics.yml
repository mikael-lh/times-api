version: 2

models:
  - name: agg_articles_by_month
    description: "Monthly aggregation of article metrics for content trend analysis"
    columns:
      - name: pub_month
        description: "{{ doc('pub_month') }}"
        tests:
          - unique
          - not_null
      - name: total_articles
        description: "{{ doc('total_articles') }}"
      - name: avg_word_count
        description: "{{ doc('avg_word_count') }}"
      - name: articles_with_authors
        description: "{{ doc('articles_with_authors') }}"
      - name: articles_with_keywords
        description: "{{ doc('articles_with_keywords') }}"

  - name: agg_author_performance
    description: "Author-level metrics aggregated across all their articles"
    columns:
      - name: author_full_name
        description: "{{ doc('author_full_name') }}"
        tests:
          - unique
          - not_null
      - name: total_articles
        description: "{{ doc('total_articles') }}"
      - name: first_article_date
        description: "{{ doc('first_article_date') }}"
      - name: last_article_date
        description: "{{ doc('last_article_date') }}"

  - name: agg_section_trends
    description: "Section and news desk trends by year"
    columns:
      - name: section_name
        description: "{{ doc('section_name') }}"
      - name: pub_year
        description: "{{ doc('pub_year') }}"
      - name: article_count
        description: "{{ doc('article_count') }}"

  - name: agg_keyword_trends
    description: "Keyword trends by year for topic analysis"
    columns:
      - name: keyword_value
        description: "{{ doc('keyword_value') }}"
      - name: pub_year
        description: "{{ doc('pub_year') }}"
      - name: article_count
        description: "{{ doc('article_count') }}"
