version: 2

models:
  - name: fct_articles
    description: "Core fact table for archive articles. One row per article."
    columns:
      - name: article_id
        description: "{{ doc('article_id') }}"
        tests:
          - unique
          - not_null
      - name: pub_date
        description: "{{ doc('pub_date') }}"
        tests:
          - not_null
      - name: section_name
        description: "{{ doc('section_name') }}"
      - name: news_desk
        description: "{{ doc('news_desk') }}"
      - name: word_count
        description: "{{ doc('word_count') }}"
      - name: author_count
        description: "{{ doc('author_count') }}"
      - name: keyword_count
        description: "{{ doc('keyword_count') }}"

  - name: fct_article_popularity
    description: "Fact table tracking article popularity over time from daily snapshots"
    columns:
      - name: snapshot_date
        description: "{{ doc('snapshot_date') }}"
        tests:
          - not_null
      - name: article_id
        description: "{{ doc('article_id') }}"
        tests:
          - not_null
      - name: days_since_published
        description: "{{ doc('days_since_published') }}"

  - name: dim_authors
    description: "Dimension table of unique authors"
    columns:
      - name: author_key
        description: "{{ doc('author_key') }}"
        tests:
          - unique
          - not_null
      - name: author_full_name
        description: "{{ doc('author_full_name') }}"

  - name: dim_keywords
    description: "Dimension table of unique keywords"
    columns:
      - name: keyword_key
        description: "{{ doc('keyword_key') }}"
        tests:
          - unique
          - not_null
      - name: keyword_name
        description: "{{ doc('keyword_name') }}"
      - name: keyword_value
        description: "{{ doc('keyword_value') }}"

  - name: bridge_article_keywords
    description: "Bridge table resolving the many-to-many relationship between articles and keywords. One row per article-keyword pair."
    columns:
      - name: article_id
        description: "Foreign key to fct_articles"
        tests:
          - not_null
          - relationships:
              to: ref('fct_articles')
              field: article_id
      - name: keyword_key
        description: "Foreign key to dim_keywords"
        tests:
          - not_null
          - relationships:
              to: ref('dim_keywords')
              field: keyword_key
      - name: keyword_name
        description: "{{ doc('keyword_name') }} Denormalised from dim_keywords for query convenience."
      - name: keyword_value
        description: "{{ doc('keyword_value') }} Denormalised from dim_keywords for query convenience."
      - name: keyword_rank
        description: "{{ doc('keyword_rank') }}"
      - name: keyword_major
        description: "{{ doc('keyword_major') }}"

  - name: dim_sections
    description: "Dimension table of unique sections and news desks"
    columns:
      - name: section_key
        description: "{{ doc('section_key') }}"
        tests:
          - unique
          - not_null
      - name: section_name
        description: "{{ doc('section_name') }}"
      - name: news_desk
        description: "{{ doc('news_desk') }}"
