version: 2

sources:
  - name: nyt_raw
    description: "Raw NYT article data loaded from GCS to BigQuery"
    database: times-api-ingest
    schema: prod
    tables:
      - name: archive_articles
        description: "Historical NYT articles from the Archive API (1851-present)"
        meta:
          partition_by: pub_date
        columns:
          - name: article_id
            description: "{{ doc('article_id') }}"
          - name: uri
            description: "{{ doc('uri') }}"
          - name: pub_date
            description: "{{ doc('pub_date') }}"
          - name: section_name
            description: "{{ doc('section_name') }}"
          - name: news_desk
            description: "{{ doc('news_desk') }}"
          - name: type_of_material
            description: "{{ doc('type_of_material') }}"
          - name: document_type
            description: "{{ doc('document_type') }}"
          - name: word_count
            description: "{{ doc('word_count') }}"
          - name: web_url
            description: "{{ doc('web_url') }}"
          - name: headline_main
            description: "{{ doc('headline_main') }}"
          - name: byline_original
            description: "{{ doc('byline_original') }}"
          - name: abstract
            description: "{{ doc('abstract') }}"
          - name: snippet
            description: "{{ doc('snippet') }}"
          - name: keywords
            description: "{{ doc('keywords') }}"
          - name: byline_person
            description: "{{ doc('byline_person') }}"
          - name: multimedia_count_by_type
            description: "{{ doc('multimedia_count_by_type') }}"

      - name: most_popular_articles
        description: "Daily snapshots of most popular (most viewed) articles"
        meta:
          partition_by: snapshot_date
        columns:
          - name: snapshot_date
            description: "{{ doc('snapshot_date') }}"
          - name: id
            description: "{{ doc('mp_id') }}"
          - name: uri
            description: "{{ doc('uri') }}"
          - name: url
            description: "{{ doc('url') }}"
          - name: asset_id
            description: "{{ doc('asset_id') }}"
          - name: source
            description: "{{ doc('source') }}"
          - name: published_date
            description: "{{ doc('published_date') }}"
          - name: updated
            description: "{{ doc('updated') }}"
          - name: section
            description: "{{ doc('section') }}"
          - name: subsection
            description: "{{ doc('subsection') }}"
          - name: byline
            description: "{{ doc('byline') }}"
          - name: type
            description: "{{ doc('type') }}"
          - name: title
            description: "{{ doc('title') }}"
          - name: abstract
            description: "{{ doc('abstract') }}"
          - name: des_facet
            description: "{{ doc('des_facet') }}"
          - name: org_facet
            description: "{{ doc('org_facet') }}"
          - name: per_facet
            description: "{{ doc('per_facet') }}"
          - name: geo_facet
            description: "{{ doc('geo_facet') }}"
          - name: media_count_by_type
            description: "{{ doc('media_count_by_type') }}"
          - name: adx_keywords
            description: "{{ doc('adx_keywords') }}"
