version: 2

models:
  - name: stg_archive_articles
    description: "Staged archive articles with cleaned column names and types"
    columns:
      - name: article_id
        description: "{{ doc('article_id') }}"
        tests:
          - unique
          - not_null
      - name: pub_date
        description: "{{ doc('pub_date') }}"
        tests:
          - not_null
      - name: section_name
        description: "{{ doc('section_name') }}"
      - name: news_desk
        description: "{{ doc('news_desk') }}"
      - name: headline_main
        description: "{{ doc('headline_main') }}"
      - name: word_count
        description: "{{ doc('word_count') }}"
      - name: keywords
        description: "{{ doc('keywords') }}"
      - name: byline_person
        description: "{{ doc('byline_person') }}"

  - name: stg_most_popular_articles
    description: "Staged most popular articles with cleaned types"
    columns:
      - name: snapshot_date
        description: "{{ doc('snapshot_date') }}"
        tests:
          - not_null
      - name: article_id
        description: "{{ doc('article_id') }}"
        tests:
          - not_null
      - name: published_at
        description: "{{ doc('published_at') }}"
      - name: section
        description: "{{ doc('section') }}"
      - name: title
        description: "{{ doc('title') }}"
