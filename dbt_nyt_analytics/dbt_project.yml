name: 'nyt_analytics'
version: '1.0.0'
config-version: 2

profile: 'nyt_bigquery'

dbt-cloud:
  project-id: 70506183138821

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Default lookback for incremental models (can be overridden at runtime)
  incremental_lookback_days: 3
  # CI PR builds pass --vars '{"pr_number": <n>}'; empty uses profile dataset (ci_dbt)
  pr_number: ""

models:
  nyt_analytics:
    +static_analysis: strict
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: dbt_staging
    intermediate:
      +materialized: view
      +schema: dbt_intermediate
    marts:
      core:
        +materialized: table
        +schema: dbt_core
      analytics:
        +materialized: table
        +schema: dbt_analytics

snapshots:
  nyt_analytics:
    +static_analysis: strict
    +persist_docs:
      relation: true
      columns: true
    +schema: dbt_snapshots
