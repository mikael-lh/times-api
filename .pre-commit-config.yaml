# Pre-commit hooks for quality checks
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Skip for a commit: git commit --no-verify

repos:
  # Ruff (linting and formatting)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ShellCheck (shell script linting)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^infra/.*\.sh$

  # Local: generate dbt manifest before documentation checks
  - repo: local
    hooks:
      - id: dbt-parse-manifest
        name: dbt parse (manifest for documentation checks)
        entry: bash -c 'cd dbt_nyt_analytics && uv run dbt deps --quiet && uv run dbt parse'
        language: system
        files: ^dbt_nyt_analytics/
        pass_filenames: false

  # dbt model documentation (requires manifest from dbt parse above)
  - repo: https://github.com/dbt-checkpoint/dbt-checkpoint
    rev: v2.0.9
    hooks:
      - id: check-model-has-properties-file
        name: dbt models have properties YAML
        files: ^dbt_nyt_analytics/models/.*\.sql$
      - id: check-model-has-description
        name: dbt models have descriptions
        files: ^dbt_nyt_analytics/models/

  # Local hooks (mypy + pytest via uv)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        args: [archive, most_popular, books, tests]
        language: system
        types: [python]
        pass_filenames: false
      
      - id: pytest
        name: pytest
        entry: uv run pytest
        args: [tests/, -v]
        language: system
        pass_filenames: false
        stages: [pre-commit]
